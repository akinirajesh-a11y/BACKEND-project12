# Production Profile Configuration
server.port=${PORT:8080}

spring.application.name=rentease-backend

# Production Database (Supplied via Environment Variables on Render / Railway)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
rentease.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
rentease.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Settings (Include deployed frontend domain e.g. https://rentease.vercel.app)
rentease.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*,http://localhost:5173,https://*.vercel.app}

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
